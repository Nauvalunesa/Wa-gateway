<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;color:#eee;font-family:Arial;background:transparent;touch-action:manipulation}.card{max-width:620px;margin:16px auto;padding:20px;background:#ffffff10;border:1px solid #ffffff25;border-radius:16px}canvas{width:100%;background:#ffffff08;border-radius:12px}header{display:flex;justify-content:space-between}p{font-size:12px;color:#aaa;text-align:center}</style><div class="card"><header><h2>Dino Runner</h2><h3 id="score">00000</h3></header><canvas id="game" width="560" height="190" tabindex="0" aria-label="Dino Runner: tap atau spasi untuk lompat"></canvas><p id="status">Tap atau spasi untuk lompat</p><p id="best"></p></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),label=document.getElementById('score'),status=document.getElementById('status'),bestLabel=document.getElementById('best');let y,vy,obstacles,score,speed,over,last=0,spawn,best=0;try{best=Number(localStorage.getItem('dino_best'))||0}catch{}function reset(){y=132;vy=0;obstacles=[];score=0;speed=5;over=false;spawn=80;status.textContent='Tap atau spasi untuk lompat'}function jump(){if(over){reset();return}if(y>=132)vy=-12}c.onpointerdown=e=>{e.preventDefault();jump()};document.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();jump()}};function loop(t){const dt=last?Math.min((t-last)/16.67,2):1;last=t;if(!over){y+=vy*dt;vy+=.75*dt;if(y>=132){y=132;vy=0}spawn-=dt;if(spawn<=0){let h=24+Math.random()*22;obstacles.push({x:580,y:170-h,w:18,h});spawn=65+Math.random()*40}speed=Math.min(11,speed+.0018*dt);score+=dt*.6;for(const o of obstacles){o.x-=speed*dt;if(59<o.x+o.w&&78>o.x&&y+30>o.y&&y+4<170){over=true;best=Math.max(best,Math.floor(score));try{localStorage.setItem('dino_best',String(best))}catch{}status.textContent='GAME OVER — tap untuk main lagi'}}obstacles=obstacles.filter(o=>o.x>-30)}x.clearRect(0,0,560,190);x.strokeStyle='#ffffff55';x.beginPath();x.moveTo(0,170);x.lineTo(560,170);x.stroke();x.fillStyle='#eee';x.fillRect(55,y,27,30);x.fillRect(77,y+5,13,18);x.fillRect(60,y+30,6,8);x.fillRect(75,y+30,6,8);x.fillStyle='#6c5ce7';x.fillRect(82,y+8,4,4);x.fillStyle='#e17a7a';for(const o of obstacles)x.fillRect(o.x,o.y,o.w,o.h);label.textContent=String(Math.floor(score)).padStart(5,'0');bestLabel.textContent='BEST '+String(best).padStart(5,'0');requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script>
