<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#eee;background:transparent}.card{max-width:620px;margin:16px auto;padding:22px;background:#ffffff10;border:1px solid #ffffff25;border-radius:16px}button{padding:14px;background:#6c5ce7;color:white;border:0;border-radius:12px;font-weight:bold;cursor:pointer;width:100%;margin-top:12px}.row{display:flex;gap:10px}input{width:100%;margin-top:15px}small{color:#aaa}#status{text-align:center;margin-top:16px;font-size:12px}</style><div class="card"><h2>🔊 Sound Test</h2><small>Offline audio test</small><button data-hz="440">TEST BEEP</button><div class="row"><button data-hz="220">LOW</button><button data-hz="440">MID</button><button data-hz="880">HIGH</button></div><button id="melody">PLAY MELODY</button><p>Frequency: <span id="label">440 Hz</span></p><input id="freq" type="range" min="100" max="2000" value="440"><div id="status">Ready — tekan tombol untuk mengeluarkan suara</div></div><script>
let ctx;const status=document.getElementById('status');async function tone(hz,duration=.5){ctx ||= new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime;osc.frequency.setValueAtTime(hz,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.35,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+duration+.05);osc.onended=()=>{osc.disconnect();gain.disconnect()};status.textContent='Playing '+hz+' Hz'}function play(hz,d){return tone(hz,d).catch(e=>status.textContent='Audio tidak tersedia: '+e.message)}document.querySelectorAll('[data-hz]').forEach(b=>b.onclick=()=>play(Number(b.dataset.hz)));const freq=document.getElementById('freq');freq.oninput=()=>document.getElementById('label').textContent=freq.value+' Hz';freq.onchange=()=>play(Number(freq.value));document.getElementById('melody').onclick=async function(){this.disabled=true;for(const n of [261.63,329.63,392,523.25,392,329.63,261.63]){await play(n,.22);await new Promise(r=>setTimeout(r,260))}status.textContent='Melody selesai';this.disabled=false};
</script>
